<div class="VPFlyout VPNavBarExtra extra" data-v-9fd4d1dd data-v-f953d92f data-v-bfe7971f><button type="button" class="button" aria-haspopup="true" aria-expanded="false" aria-label="extra navigation" data-v-bfe7971f><span class="vpi-more-horizontal icon" data-v-bfe7971f></span></button><div class="menu" data-v-bfe7971f><div class="VPMenu" data-v-bfe7971f data-v-20ed86d6><!----><!--[--><!--[--><!----><div class="group" data-v-f953d92f><div class="item appearance" data-v-f953d92f><p class="label" data-v-f953d92f>外观</p><div class="appearance-action" data-v-f953d92f><button class="VPSwitch VPSwitchAppearance" type="button" role="switch" title aria-checked="false" data-v-f953d92f data-v-be9742d9 data-v-b4ccac88><span class="check" data-v-b4ccac88><span class="icon" data-v-b4ccac88><!--[--><span class="vpi-sun sun" data-v-be9742d9></span><span class="vpi-moon moon" data-v-be9742d9></span><!--]--></span></span></button></div></div></div><!----><!--]--><!--]--></div></div></div><!--[--><!--]--><button type="button" class="VPNavBarHamburger hamburger" aria-label="mobile navigation" aria-expanded="false" aria-controls="VPNavScreen" data-v-9fd4d1dd data-v-6bee1efd><span class="container" data-v-6bee1efd><span class="top" data-v-6bee1efd></span><span class="middle" data-v-6bee1efd></span><span class="bottom" data-v-6bee1efd></span></span></button></div></div></div></div><div class="divider" data-v-9fd4d1dd><div class="divider-line" data-v-9fd4d1dd></div></div></div><!----></header><!----><!----><div class="VPContent is-home" id="VPContent" data-v-d8b57b2d data-v-9a6c75ad><div class="VPHome" data-v-9a6c75ad data-v-e07eaea7><!--[--><!--]--><div class="VPHero has-image VPHomeHero" data-v-e07eaea7 data-v-dd8814ff><div class="container" data-v-dd8814ff><div class="main" data-v-dd8814ff><!--[--><!--]--><!--[--><h1 class="heading" data-v-dd8814ff><span class="name clip" data-v-dd8814ff>Semantic Installer</span><span class="text" data-v-dd8814ff>类 HTML 语义化安装引擎</span></h1><p class="tagline" data-v-dd8814ff>基于 Rust + egui 的跨平台安装程序引擎：以「类 HTML 语义标签」声明式定义安装界面，内置固定画布布局引擎、安装 / 卸载流程引擎与一体化卸载工具。完全开源（MIT）。</p><!--]--><!--[--><!--]--><div class="actions" data-v-dd8814ff><!--[--><div class="action" data-v-dd8814ff><a class="VPButton medium brand" href="/Semantic-Installer/quick-start" data-v-dd8814ff data-v-93dc4167>快速开始</a></div><div class="action" data-v-dd8814ff><a class="VPButton medium alt" href="/Semantic-Installer/architecture" data-v-dd8814ff data-v-93dc4167>开发者文档</a></div><!--]--></div><!--[--><!--]--></div><div class="image" data-v-dd8814ff><div class="image-container" data-v-dd8814ff><div class="image-bg" data-v-dd8814ff></div><!--[--><!--[--><img class="VPImage image-src" src="/Semantic-Installer/logo.svg" alt="Semantic Installer" data-v-ab19afbb><!--]--><!--]--></div></div></div></div><!--[--><!--]--><!--[--><!--]--><div class="VPFeatures VPHomeFeatures" data-v-e07eaea7 data-v-b1eea84a><div class="container" data-v-b1eea84a><div class="items" data-v-b1eea84a><!--[--><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>类 HTML 语义标签</h2><p class="details" data-v-bd37d1a2><window> <page> <layer> <row> <column> <text> <button> <input> <checkbox> <radio> <select> <progress> <image> <link> 等语义化组件，手写词法 + 递归下降解析器，解析错误带行列号。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>图层（Layer）渲染</h2><p class="details" data-v-bd37d1a2>同一固定画布上多层 z 序叠加：背景铺底 + 前景控件。支持 bg 背景色（含</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>多语言 i18n</h2><p class="details" data-v-bd37d1a2>lang/{locale}.toml 语言资源 + 运行时一键切换；语言选择可前置为流程第一步，安装后写入应用配置供产品联动。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>简单样式动画</h2><p class="details" data-v-bd37d1a2>animate 属性声明式动画：fade-in / slide / spin / pulse / scale-in，支持 infinite / delay；纯渲染期时间插值、不侵入布局，进度条平滑过渡。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>安装流程引擎</h2><p class="details" data-v-bd37d1a2>清单（TOML）驱动 → 动作集（复制 / 写文件 / 快捷方式 / 注册表 / 运行进程）→ 后台线程执行 → 进度上报 → 失败 / 取消逆序回滚 → 全程 install.log。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>一体化卸载工具</h2><p class="details" data-v-bd37d1a2>与安装器共享同一 UI 外壳与流程引擎（统一底层架构），仅以模式区分；Windows 下自动登记「添加 / 删除程序」卸载入口。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>非系统标题栏模式</h2><p class="details" data-v-bd37d1a2>--no-titlebar 去掉原生标题栏、客户区内自绘标题栏（拖动 / 最小化 / 关闭）；--titlebar-transparent 让标题栏透明透出背景图，文字图标干净绘制。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>固定画布布局引擎</h2><p class="details" data-v-bd37d1a2>窗口尺寸固定不可变（禁缩放 / 最大化），引擎不做自适应布局——解析期即可确定每个控件的矩形，布局确定、可单测，内容溢出有解析期告警。</p><!----></article><!--]--></div></div><div class="grid-6 item" data-v-b1eea84a><div class="VPLink no-icon VPFeature" data-v-b1eea84a data-v-bd37d1a2><!--[--><article class="box" data-v-bd37d1a2><!----><h2 class="title" data-v-bd37d1a2>可靠性设计</h2><p class="details" data-v-bd37d1a2>应用代码 0 unsafe（仅 Windows COM 互操作两处经审计 unsafe）、UI 路径无 unwrap/expect、panic hook 记录日志后优雅退出、后台线程仅经 channel 通信。</p><!----></article><!--]--></div></div><!--]--></div></div></div><!--[--><!--]--><div class="vp-doc container" style="" data-v-e07eaea7 data-v-c141a4bd><!--[--><div style="position:relative;" data-v-e07eaea7><div><div class="vp-doc" style="padding:0 1rem 2rem;"><h2 id="解决什么问题" tabindex="-1">解决什么问题 <a class="header-anchor" href="#解决什么问题" aria-label="Permalink to &quot;解决什么问题&quot;">​</a></h2><p>开源生态中长期缺少<strong>美观、现代化</strong>的安装界面解决方案：主流安装程序界面风格古板、自定义程度极低。Semantic Installer 以「类 HTML 语义标签」的声明式方式定义安装界面，配合图层、动画、多语言与透明标题栏能力，让开发者像写网页一样轻松构建<strong>大厂级</strong>的安装体验。</p><h2 id="技术选型" tabindex="-1">技术选型 <a class="header-anchor" href="#技术选型" aria-label="Permalink to &quot;技术选型&quot;">​</a></h2><table tabindex="0"><thead><tr><th>层</th><th>技术</th><th>职责</th></tr></thead><tbody><tr><td>语义化核心</td><td><code>semantic-ui</code>（Rust，零 GUI）</td><td>词法 / 语法 / AST / 布局 / 组件 / 主题</td></tr><tr><td>流程引擎</td><td><code>flow-engine</code>（Rust，零 GUI）</td><td>清单 / 动作 / 执行器 / 回滚 / 平台实现</td></tr><tr><td>界面适配</td><td><code>ui-adapter</code>（Rust + egui 0.35）</td><td>固定窗口壳 / 节点渲染 / 字体 / 主题 / 事件（唯一 GUI 层）</td></tr><tr><td>应用入口</td><td><code>apps/installer</code>、<code>apps/uninstaller</code></td><td>安装程序入口 / 一体化卸载工具入口</td></tr></tbody></table><h2 id="快速上手-windows" tabindex="-1">快速上手（Windows） <a class="header-anchor" href="#快速上手-windows" aria-label="Permalink to &quot;快速上手（Windows）&quot;">​</a></h2><div class="language-powershell vp-adaptive-theme"><button title="Copy Code" class="copy"></button><span class="lang">powershell</span><pre class="shiki shiki-themes github-light github-dark vp-code" tabindex="0"><code><span class="line"><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">cargo build </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">--</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">release</span></span>
<span class="line"></span>
<span class="line"><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">cd examples\demo</span></span>
<span class="line"><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">..\..\target\release\</span><span style="--shiki-light:#005CC5;--shiki-dark:#79B8FF;">installer.exe</span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;"> --</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">manifest install.toml </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">--</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8;">markup app.ui </span><span style="--shiki-light:#D73A49;--shiki-dark:#F97583;">`</span></span>
